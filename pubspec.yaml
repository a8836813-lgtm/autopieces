name: autopieces
description: Prototype of a local car-parts marketplace app with camera part recognition (graduation project).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  flutter_map: ^7.0.2
  geolocator: ^13.0.2
  http: ^1.2.2
  latlong2: ^0.9.1
  material_ui: ^1.11.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brands/
